    # =======================
    # WEB SCRAPING
    # =======================
    "playwright>=1.51.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.1",

    # =======================
    # FINANCE / NLP
    # =======================
    "yfinance>=0.2.66",
    "textblob>=0.17.1",
    "polygon-api-client>=1.16.3",

    # =======================
    # VISUAL / UI / PDF
    # =======================
    "plotly>=6.5.0",
    "streamlit>=1.51.0",
    "reportlab>=4.4.5",
    "fastapi",
    "Pillow",
    "python-docx",
    "matplotlib",
    "fpdf",
