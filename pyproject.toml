    # =======================
    # IPYNB SUPPORT
    # =======================
    "ipykernel>=7.1.0",

    # =======================
    # TOOLS
    # =======================
    "ddgs>=9.9.2",
    "duckduckgo_search",
    "azure-identity>=1.25.1",

