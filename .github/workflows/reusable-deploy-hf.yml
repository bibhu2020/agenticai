name: Deploy App to Hugging Face (reusable)

# Standard deployment template for Streamlit / FastAPI apps.
# Stages: src/<app_path> + pyproject.toml + uv.lock + Dockerfile + run.py
# Optionally stages src/_mcpservers/ for apps that launch MCP subprocesses.
# Then uploads deploy_temp/ to the target HF Space.

on:
  workflow_call:
    inputs:
      app_path:
        description: Path to the app inside the repo (e.g. src/market-analyst)
        required: true
        type: string
      hf_space_name:
        description: HuggingFace Space name (without username prefix)
        required: true
        type: string
      include_uv_lock:
        description: Whether to copy uv.lock
        type: boolean
        default: true
      include_mcpservers:
        description: Whether to copy src/_mcpservers/ (needed by apps that spawn MCP subprocesses)
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        required: true
      HF_USERNAME:
        required: true

jobs:
  deploy:
    name: Deploy to Hugging Face
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Stage deployment directory
        run: |
          mkdir -p deploy_temp/src
          cp -r "${{ inputs.app_path }}" deploy_temp/src/
          cp pyproject.toml deploy_temp/
          if [[ "${{ inputs.include_uv_lock }}" == "true" ]] && [ -f uv.lock ]; then
            cp uv.lock deploy_temp/
          fi
          if [[ "${{ inputs.include_mcpservers }}" == "true" ]] && [ -d src/_mcpservers ]; then
            cp -r src/_mcpservers deploy_temp/src/
          fi
          cp "${{ inputs.app_path }}/Dockerfile" deploy_temp/
          cp "${{ inputs.app_path }}/README.md" deploy_temp/ 2>/dev/null || true
          [ -f run.py ] && cp run.py deploy_temp/ || true
          echo "Staged deployment for ${{ inputs.app_path }}:"
          ls -la deploy_temp/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upload to Hugging Face
        uses: ./.github/actions/upload-to-hf
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_id: ${{ secrets.HF_USERNAME }}/${{ inputs.hf_space_name }}
