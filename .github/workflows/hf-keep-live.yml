name: Keep HF Spaces Live

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping_spaces:
    runs-on: ubuntu-latest

    steps:
      - name: Ping HF Spaces (HEAD requests)
        run: |
          URLS=(
            "https://mishrabp-chatbot-app.hf.space"
            "https://mishrabp-deep-research.hf.space"
            "https://mishrabp-healthcare-assistant.hf.space"
            "https://mishrabp-stock-analyst.hf.space"
            "https://mishrabp-travel-agent.hf.space"
            "https://mishrabp-market-analyst.hf.space"
            "https://mishrabp-trip-planner-api.hf.space"
          )
          for url in "${URLS[@]}"; do
            echo "Pinging $url ..."
            curl -s -o /dev/null -w "%{http_code} $url\n" "$url" || true
          done
