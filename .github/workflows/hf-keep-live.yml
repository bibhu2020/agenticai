name: Keep HF Spaces Live

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping_spaces:
    runs-on: ubuntu-latest

    steps:
      - name: Ping HF Spaces (HEAD requests)
        run: |
          URLS=(
            "https://mishrabp-fifa.hf.space"
            "https://mishrabp-athena.hf.space"
            "https://mishrabp-remedy.hf.space"
            "https://mishrabp-news.hf.space"
            "https://mishrabp-options.hf.space"
          )
          for url in "${URLS[@]}"; do
            echo "Pinging $url ..."
            curl -s -o /dev/null -w "%{http_code} $url\n" "$url" || true
          done
