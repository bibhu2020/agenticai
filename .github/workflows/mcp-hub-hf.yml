
name: Deploy MCP HUB to Hugging Face

env:
  PROJECT_PATH: src/mcp-hub
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_SPACE_NAME: mcp-hub
  REPO_ID: ${{ secrets.HF_USERNAME }}/mcp-hub

on:
  push:
    branches:
      - main
    paths:
      - 'src/mcp-hub/**'
      - '.github/workflows/mcp-hub-hf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Create deployment directory
      run: |
        mkdir -p deploy_temp
        cp -r src/mcp-hub/* deploy_temp/
        
    - name: Deploy to Hugging Face
      run: |
        python -m pip install huggingface_hub
        python -c "
        from huggingface_hub import HfApi, create_repo
        import os
        
        api = HfApi()
        repo_id = os.environ['REPO_ID']
        token = os.environ['HF_TOKEN']
        
        try:
            create_repo(
                repo_id=repo_id,
                token=token,
                repo_type='space',
                space_sdk='docker',
                private=False,
                exist_ok=True
            )
            
            api.upload_folder(
                folder_path='deploy_temp',
                repo_id=repo_id,
                repo_type='space',
                token=token,
                ignore_patterns=['node_modules', '.git']
            )
            print('Deployment successful!')
        except Exception as e:
            print(f'Error deploying: {e}')
            exit(1)
        "
