
name: Deploy MCP Secure RAG to Hugging Face

env:
  PROJECT_PATH: src/mcp-rag-secure
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_SPACE_NAME: mcp-rag-secure
  REPO_ID: ${{ secrets.HF_USERNAME }}/mcp-rag-secure

on:
  push:
    branches:
      - main
    paths:
      - 'src/mcp-rag-secure/**'
      - '.github/workflows/mcp-rag-secure-hf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub

    - name: Create deployment directory
      run: |
        mkdir -p deploy_temp/src
        # Copy all MCP servers (hub, weather, github, etc.)
        cp -r src/mcp-* deploy_temp/src/
        # Copy core utilities (telemetry)
        cp -r src/core deploy_temp/src/
        cp pyproject.toml deploy_temp/
        cp src/mcp-rag-secure/Dockerfile deploy_temp/
        cp src/mcp-rag-secure/README.md deploy_temp/ || true
        
    - name: Deploy to Hugging Face
      run: |
        python -c "
        from huggingface_hub import HfApi, create_repo
        import os
        
        api = HfApi()
        repo_id = os.environ['REPO_ID']
        token = os.environ['HF_TOKEN']
        
        try:
            create_repo(
                repo_id=repo_id,
                token=token,
                repo_type='space',
                space_sdk='docker',
                private=False,
                exist_ok=True
            )
            print(f'Ensured repository exists: {repo_id}')
            
            api.upload_folder(
                folder_path='deploy_temp',
                repo_id=repo_id,
                repo_type='space',
                token=token,
                ignore_patterns=['.git', '.github', '__pycache__', '*.pyc']
            )
            print('Deployment successful!')
        except Exception as e:
            print(f'Error deploying: {e}')
            exit(1)
        "
