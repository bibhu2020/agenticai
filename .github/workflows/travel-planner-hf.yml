name: Deploy Odyssey to Hugging Face

on:
  push:
    branches: [ main ]
    paths:
      - 'src/travel-planner/**'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-hf.yml
    with:
      app_path: src/travel-planner
      hf_space_name: travel-agent
    secrets: inherit
