name: DAST OWASP ZAP Scan

on:
  workflow_call:
    inputs:
      target_url:
        description: "URL to scan"
        required: true
        type: string

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write # for creating issues if desired, though we usually just report
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          # default fail_on is usually all, but we can configure.
          # The action returns exit code 1 if issues found.
