name: News Digest Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

# Only one full run at a time — a scheduled run and a manual force-trigger
# overlapping would otherwise race to push src/news/data/news.json. A second
# trigger while one is in progress queues behind it rather than running
# concurrently.
concurrency:
  group: news-agent-daily
  cancel-in-progress: false

jobs:
  run-agent:
    name: Fetch & Summarize (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: [world, usa, india, odisha, sports, cricket, usa_stock, ai, quantum, trump, local]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --no-dev --prerelease=allow

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-model-files

      - name: Run news digest agent for this category
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWS_CATEGORIES: ${{ matrix.category }}
        run: |
          source .venv/bin/activate
          python src/news/backend/scripts/run_agent.py

      - name: Upload partial result
        uses: actions/upload-artifact@v4
        with:
          name: news-partial-${{ matrix.category }}
          path: src/news/data/partial/${{ matrix.category }}.json
          if-no-files-found: warn
          retention-days: 1

  run-local-extras:
    name: Fetch Weather + Events (local)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --no-dev --prerelease=allow

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-model-files

      - name: Run local weather + events collector
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          source .venv/bin/activate
          python src/news/backend/scripts/run_local_extras.py

      - name: Upload weather partial result
        uses: actions/upload-artifact@v4
        with:
          name: news-partial-local_weather
          path: src/news/data/partial/local_weather.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload events partial result
        uses: actions/upload-artifact@v4
        with:
          name: news-partial-local_events
          path: src/news/data/partial/local_events.json
          if-no-files-found: warn
          retention-days: 1

  merge:
    name: Merge & Commit
    needs: [run-agent, run-local-extras]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          pattern: news-partial-*
          path: src/news/data/partial
          merge-multiple: true

      - name: Merge partials into news.json
        run: python src/news/backend/scripts/merge_partials.py

      - name: Commit and push updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/news/data/news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore(news): daily digest update"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $i/3) — fetching + rebasing onto the latest main …"
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase conflict — aborting, manual intervention needed"; git rebase --abort; exit 1; }
            sleep 3
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Report status
        if: always()
        run: echo "News digest agent run complete at $(date -u)"

  translate-hindi:
    name: Translate & Narrate (Hindi, ${{ matrix.category }})
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: [world, usa, india, odisha, sports, cricket, usa_stock, ai, quantum, trump, local, local_weather, local_events]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --no-dev --prerelease=allow

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-model-files

      - name: Translate + narrate this category into Hindi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          NEWS_HINDI_CATEGORY: ${{ matrix.category }}
        run: |
          source .venv/bin/activate
          python src/news/backend/scripts/run_hindi_translation.py

      - name: Upload Hindi partial result
        uses: actions/upload-artifact@v4
        with:
          name: hindi-partial-${{ matrix.category }}
          path: src/news/data/partial_hindi/${{ matrix.category }}.json
          if-no-files-found: warn
          retention-days: 1

  merge-hindi:
    name: Merge Hindi Translations & Commit
    needs: translate-hindi
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all Hindi partial results
        uses: actions/download-artifact@v4
        with:
          pattern: hindi-partial-*
          path: src/news/data/partial_hindi
          merge-multiple: true

      - name: Merge Hindi partials into news.json
        run: python src/news/backend/scripts/merge_hindi_partials.py

      - name: Commit and push Hindi translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/news/data/news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore(news): daily hindi translation update"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $i/3) — fetching + rebasing onto the latest main …"
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase conflict — aborting, manual intervention needed"; git rebase --abort; exit 1; }
            sleep 3
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Report status
        if: always()
        run: echo "Hindi translation pass complete at $(date -u)"
