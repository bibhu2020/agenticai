name: News Digest Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  run-agent:
    name: Fetch & Summarize Daily News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --no-dev --prerelease=allow

      - name: Run news digest agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          source .venv/bin/activate
          python src/news/backend/scripts/run_agent.py

      - name: Commit and push updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/news/data/news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore(news): daily digest update"
          git push

      - name: Report status
        if: always()
        run: echo "News digest agent run complete at $(date -u)"
