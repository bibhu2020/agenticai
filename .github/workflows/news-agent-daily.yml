name: News Digest Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  run-agent:
    name: Fetch & Summarize (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: [world, usa, india, odisha, sports, cricket, usa_stock, ai, quantum, trump]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --no-dev --prerelease=allow

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-model-files

      - name: Run news digest agent for this category
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          NEWS_CATEGORIES: ${{ matrix.category }}
        run: |
          source .venv/bin/activate
          python src/news/backend/scripts/run_agent.py

      - name: Upload partial result
        uses: actions/upload-artifact@v4
        with:
          name: news-partial-${{ matrix.category }}
          path: src/news/data/partial/${{ matrix.category }}.json
          if-no-files-found: warn
          retention-days: 1

  merge:
    name: Merge & Commit
    needs: run-agent
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          pattern: news-partial-*
          path: src/news/data/partial
          merge-multiple: true

      - name: Merge partials into news.json
        run: python src/news/backend/scripts/merge_partials.py

      - name: Commit and push updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/news/data/news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore(news): daily digest update"
          git push

      - name: Report status
        if: always()
        run: echo "News digest agent run complete at $(date -u)"
