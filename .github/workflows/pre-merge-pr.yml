name: Pre-Merge PR Checks

# Runs on every PR targeting main.
# ALL three jobs (unit-tests, codeql-scan, dependabot-scan) must pass
# before the security-gate job succeeds — configure this workflow as a
# required status check in branch-protection settings to block merges.

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write

jobs:
  # ── 1. Unit Tests & Coverage ───────────────────────────────────────────────
  unit-tests:
    name: Unit Tests & Coverage
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      python_version: "3.12"
      coverage_threshold: "30"

  # ── 2. SAST – CodeQL ──────────────────────────────────────────────────────
  codeql-scan:
    name: SAST – CodeQL Scan
    uses: ./.github/workflows/reusable-sast-codeql.yml
    with:
      language: python
    permissions:
      security-events: write
      actions: read
      contents: read
    secrets: inherit

  # ── 3. SCA – Dependabot ───────────────────────────────────────────────────
  dependabot-scan:
    name: SCA – Dependabot Scan
    uses: ./.github/workflows/reusable-sca-dependabot.yml
    secrets: inherit

  # ── 4. Security Gate (merge blocker) ──────────────────────────────────────
  security-gate:
    name: Security Gate
    needs: [unit-tests, codeql-scan, dependabot-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Fail – Unit tests did not pass
        if: needs.unit-tests.result != 'success'
        run: |
          echo "::error::Unit tests failed or were skipped. Fix before merging."
          exit 1

      - name: Fail – CodeQL found critical/high issues
        if: needs.codeql-scan.result == 'success'
        run: |
          count=${{ needs.codeql-scan.outputs.critical_high_issues }}
          echo "CodeQL Critical/High Issues: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count critical/high severity issue(s). Fix before merging."
            exit 1
          fi

      - name: Fail – Dependabot found critical vulnerabilities
        if: needs.dependabot-scan.result == 'success'
        run: |
          count=${{ needs.dependabot-scan.outputs.critical_issues }}
          echo "Dependabot Critical Issues: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Dependabot found $count critical vulnerability/ies. Fix before merging."
            exit 1
          fi

      - name: Fail – One or more security scans did not complete
        if: >
          needs.codeql-scan.result != 'success' ||
          needs.dependabot-scan.result != 'success'
        run: |
          echo "::error::Security scans did not complete successfully. Cannot merge."
          exit 1

      - name: All checks passed
        run: echo "All pre-merge checks passed. Safe to merge."
