name: Deploy Chatbot APP to Hugging Face

env:
  PROJECT_PATH: src/chatbot
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_SPACE_NAME: chatbot-app
  REPO_ID: ${{ secrets.HF_USERNAME }}/chatbot-app

on:
  push:
    branches:
      - main
    paths:
      - 'src/chatbot_v1/**'
      - 'src/chatbot_v2/**'
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read
  issues: write

jobs:
  sast-scan:
    name: SAST Security Scan
    uses: ./.github/workflows/reusable-sast-codeql.yml
    with:
      language: 'python'

  dependabot-check:
    name: SCA Dependabot Check
    uses: ./.github/workflows/reusable-sca-dependabot.yml
    secrets: inherit

  upload-to-hf:
    needs: [sast-scan, dependabot-check]
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.set_url.outputs.url }}

    steps:
    - name: Set App URL
      id: set_url
      run: echo "url=https://${{ secrets.HF_USERNAME }}-chatbot-app.hf.space" >> $GITHUB_OUTPUT
    - name: Verify Security Scan Results
      run: |
        SAST_COUNT="${{ needs.sast-scan.outputs.critical_high_issues }}"
        SCA_COUNT="${{ needs.dependabot-check.outputs.critical_issues }}"
        
        echo "SAST Scan found $SAST_COUNT critical/high issues."
        echo "SCA Dependabot Check found $SCA_COUNT critical issues."
        
        if [ "$SAST_COUNT" -gt 0 ]; then
          echo "Stopping pipeline due to SAST security issues."
          exit 1
        fi
        
        if [ "$SCA_COUNT" -gt 0 ]; then
          echo "Stopping pipeline due to SCA Dependabot security issues."
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v3

    - uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          v2:
            - 'src/chatbot_v2/**'
          v1:
            - 'src/chatbot_v1/**'

    - name: Determine configuration
      run: |
        if [[ "${{ steps.changes.outputs.v2 }}" == "true" ]]; then
          echo "APP_NAME=chatbot_v2" >> $GITHUB_ENV
          echo "APP_PATH=src/chatbot_v2" >> $GITHUB_ENV
          echo "Deploying Chatbot V2"
        else
          echo "APP_NAME=chatbot_v1" >> $GITHUB_ENV
          echo "APP_PATH=src/chatbot_v1" >> $GITHUB_ENV
          echo "Deploying Chatbot V1"
        fi

    - name: Create deployment directory structure
      run: |
        # Create a temporary deployment directory
        mkdir -p deploy_temp
        
        # Create parent directories for nested copies
        mkdir -p deploy_temp/src
        
        # Copy required folders
        cp -r common deploy_temp/
        # Copy specific app folder to its correct path structure
        cp -r ${{ env.APP_PATH }} deploy_temp/src/
        
        # Copy project metadata files
        cp uv.lock deploy_temp/
        cp pyproject.toml deploy_temp/
        
        # Copy Dockerfile and run.py from the detected app to root of deploy_temp
        cp ${{ env.APP_PATH }}/Dockerfile deploy_temp/
        cp ${{ env.APP_PATH }}/README.md deploy_temp/ || true
        cp run.py deploy_temp/
        
        echo "Deployment directory structure created for ${{ env.APP_NAME }}"
        ls -la deploy_temp/

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub

    - name: Create upload script
      run: |
        cat << 'EOF' > upload_to_hf.py
        from huggingface_hub import HfApi, create_repo
        import os
        import sys
        from pathlib import Path

        DEPLOY_PATH = "deploy_temp"
        REPO_ID = os.environ["REPO_ID"]
        TOKEN = os.environ["HF_TOKEN"]

        def main():
            # Authenticate
            api = HfApi()

            # Create the Space if it doesn't exist
            try:
                create_repo(
                    repo_id=REPO_ID,
                    token=TOKEN,
                    repo_type="space",
                    space_sdk="docker",
                    private=False
                )
                print(f"Created new repository: {REPO_ID}")
            except Exception as e:
                if "You already created this space" in str(e):
                    print(f"Repository {REPO_ID} already exists")
                else:
                    print(f"Error creating repository: {e}")
                    sys.exit(1)

            # Upload folder
            try:
                print(f"Uploading files from {DEPLOY_PATH} to {REPO_ID}...")
                api.upload_folder(
                    folder_path=DEPLOY_PATH,
                    repo_id=REPO_ID,
                    repo_type="space",
                    token=TOKEN,
                    ignore_patterns=[
                        ".env*",
                        ".venv/**",
                        "venv/**",
                        "__pycache__/**",
                        "*.pyc",
                        ".git/**",
                        ".pytest_cache/**",
                        ".coverage",
                        "dockers/**",
                    ],
                )
                print("Upload completed successfully")
            except Exception as e:
                print(f"Error uploading files: {e}")
                sys.exit(1)

        if __name__ == "__main__":
            main()
        EOF

    - name: Upload to Hugging Face Hub
      run: python upload_to_hf.py

  dast-scan:
    name: DAST Security Scan
    needs: upload-to-hf
    uses: ./.github/workflows/reusable-dast-zap.yml
    with:
      target_url: ${{ needs.upload-to-hf.outputs.app_url }}

