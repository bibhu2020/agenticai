name: Deploy Athena to Hugging Face

on:
  push:
    branches: [ main ]
    paths:
      - 'src/athena/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hugging Face
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Stage deployment directory
        run: |
          mkdir -p deploy_temp/src
          cp -r src/athena deploy_temp/src/
          cp pyproject.toml deploy_temp/
          cp uv.lock deploy_temp/
          cp -r src/_mcpservers deploy_temp/src/ 2>/dev/null || true
          cp src/athena/Dockerfile deploy_temp/
          cp src/athena/README.md deploy_temp/ 2>/dev/null || true
          cp run.py deploy_temp/ 2>/dev/null || true
          echo "Staged deployment:"
          ls -la deploy_temp/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upload to Hugging Face
        uses: ./.github/actions/upload-to-hf
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_id: ${{ secrets.HF_USERNAME }}/athena
