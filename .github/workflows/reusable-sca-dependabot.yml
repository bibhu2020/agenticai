name: SCA Dependabot Check (template)

on:
  workflow_call:
    outputs:
      critical_issues:
        description: "Count of Critical issues"
        value: ${{ jobs.check-dependabot.outputs.issue_count }}

jobs:
  check-dependabot:
    runs-on: ubuntu-latest
    outputs:
      issue_count: ${{ steps.count_issues.outputs.count }}

    steps:
      - name: Check Dependabot Alerts
        id: count_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for Critical Dependabot alerts..."
          
          # specific endpoint for dependabot alerts
          # filtering by state=open and severity=critical
          # Note: This requires 'dependabot-alerts: read' permission
          
          # Attempt to check alerts. If disabled (403), swallow error and report 0.
          set +e
          OUTPUT=$(gh api "/repos/${{ github.repository }}/dependabot/alerts?state=open&severity=critical" --jq 'length' 2>&1)
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Warning: Could not fetch Dependabot alerts. Dependabot might be disabled or token lacks permission."
            echo "Error details: $OUTPUT"
            echo "Assuming 0 critical alerts to allow pipeline to proceed (FAIL OPEN)."
            COUNT=0
          else
            COUNT=$OUTPUT
          fi
          
          echo "Found $COUNT critical alerts."
          echo "count=$COUNT" >> $GITHUB_OUTPUT
