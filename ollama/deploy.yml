# Kubernetes Deployment + NodePort Service for local cluster
# Deploys the locally-built image `ollama-ministral-3b:local` and
# exposes it on NodePort 30080 -> container port 8080.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-ministral-3b
  labels:
    app: ollama-ministral-3b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-ministral-3b
  template:
    metadata:
      labels:
        app: ollama-ministral-3b
    spec:
      containers:
        - name: ollama
          image: ollama-ministral-3b:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources: {}

---

apiVersion: v1
kind: Service
metadata:
  name: ollama-ministral-3b-svc
spec:
  type: NodePort
  selector:
    app: ollama-ministral-3b
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081

# Notes:
# - For local clusters (kind/minikube), you may need to load the image into the cluster.
#   * kind: `kind load docker-image ollama-ministral-3b:local --name <cluster-name>`
#   * minikube: `minikube image load ollama-ministral-3b:local`
# - After applying this YAML (`kubectl apply -f deploy.yml`), access the model at:
#     http://<node-ip>:30080
#   On a local machine node IP is often localhost when using minikube tunnel or port-forward.
