<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>

  <!-- folded newspaper: dog-eared top-right corner -->
  <path d="M14 13 H42 L50 21 V51 H14 Z" fill="#F3F4F6"/>
  <path d="M42 13 L50 21 H42 Z" fill="#C9CEDB"/>

  <!-- masthead band -->
  <rect x="18" y="19" width="19" height="6" rx="1.5" fill="#F59E0B"/>

  <!-- headline / body lines -->
  <rect x="18" y="30" width="28" height="3" rx="1.2" fill="#0B1220"/>
  <rect x="18" y="36" width="28" height="3" rx="1.2" fill="#0B1220"/>
  <rect x="18" y="42" width="17" height="3" rx="1.2" fill="#0B1220"/>

  <!-- pulse dot: signals "live / daily update" -->
  <circle cx="46" cy="44.5" r="4" fill="#F59E0B"/>
  <circle cx="46" cy="44.5" r="1.4" fill="#0B1220"/>
</svg>
